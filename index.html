<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Italian Learning</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Italian Learning">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8f3ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1916" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f8f3ea; --card:#fffdf9; --ink:#2a2420; --muted:#7b7067; --line:#e7dccd;
  --terra:#b9532d; --terra-soft:#f3dfd3; --olive:#5d6b35; --olive-soft:#e4e8d3;
  --gold:#b8862b; --gold-soft:#f4e7c9; --red:#b23a3a; --red-soft:#f5dada;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1c1916; --card:#25211d; --ink:#f1ebe3; --muted:#a89d92; --line:#3a332c;
    --terra:#e07b52; --terra-soft:#3d2a21; --olive:#a8b874; --olive-soft:#2d3122;
    --gold:#d9a94d; --gold-soft:#3a3020; --red:#e07070; --red-soft:#3d2424;
    --shadow:0 1px 2px rgba(0,0,0,.3); }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
:root{--serif:ui-serif,'New York',Georgia,'Times New Roman',serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top{max-width:760px;margin:0 auto;padding:10px 16px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--serif);font-weight:650;font-size:22px;margin:0;letter-spacing:-.01em}
h1 span{color:var(--terra)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:color-mix(in srgb,var(--card) 94%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:1px;text-decoration:none;color:var(--muted);font-weight:500;font-size:11px;padding:4px 0}
nav a i{font-style:normal;font-size:21px;line-height:1.2;filter:grayscale(1);opacity:.7}
nav a.on{color:var(--terra)}
nav a.on i{filter:none;opacity:1}
.topic{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.topic:last-child{border:0}
.gen-item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.gen-item input{margin-top:4px;width:18px;height:18px;accent-color:var(--terra);flex:none}
.explain{white-space:pre-wrap;font-size:14px;line-height:1.55;background:color-mix(in srgb,var(--olive-soft) 60%,transparent);border-radius:10px;padding:10px 12px;margin-top:10px}
h2{font-family:var(--serif);font-weight:650;font-size:24px;margin:24px 0 4px;letter-spacing:-.01em}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:var(--serif);font-size:28px;font-weight:650;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--terra);border-color:var(--terra);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px}
.btn.icon{width:44px;padding:0}
.btn.big{min-height:52px;font-size:17px;padding:12px 22px}
.btn:disabled{opacity:.45;cursor:default}
.btn.rec{background:var(--red);border-color:var(--red);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
select,input[type=text],input[type=number],textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-height:42px;color:var(--ink)}
textarea{resize:vertical;min-height:60px}
.controls{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
input[type=range]{width:100%;accent-color:var(--terra)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.chk input{accent-color:var(--terra);width:18px;height:18px}
/* recall */
.prompt{font-family:var(--serif);font-size:28px;line-height:1.25;font-weight:500;margin:6px 0 4px;letter-spacing:-.01em}
.answer{font-family:var(--serif);font-size:28px;line-height:1.3;font-weight:650;color:var(--terra);margin:4px 0}
.en{color:var(--muted);font-size:16px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--olive-soft);color:var(--olive)}
.tag.new{background:var(--gold-soft);color:var(--gold)}
.tag.learn{background:var(--terra-soft);color:var(--terra)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rate button{border-radius:12px;border:1px solid var(--line);background:var(--card);padding:10px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:62px}
.rate button b{font-size:15px}
.rate button span{font-size:12px;color:var(--muted)}
.rate .r1{border-color:var(--red)} .rate .r1 b{color:var(--red)}
.rate .r2 b{color:var(--gold)} .rate .r3 b{color:var(--olive)} .rate .r4 b{color:var(--terra)}
.rate button.sug{box-shadow:0 0 0 2px var(--olive)}
.w{border-radius:5px;padding:0 2px}
.w.ok{background:var(--olive-soft);color:var(--olive)}
.w.miss{background:var(--red-soft);color:var(--red);text-decoration:underline wavy;text-underline-offset:4px}
.score{font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--olive);border-radius:99px}
.secrow{display:grid;grid-template-columns:1fr 70px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.secrow:last-child{border:0}
/* listen */
.player{text-align:center;padding:26px 18px}
.player .it{font-family:var(--serif);font-size:30px;font-weight:650;line-height:1.25;min-height:76px;display:flex;align-items:center;justify-content:center}
.player .meta{font-size:13px;color:var(--muted);margin-top:10px}
.pctl{display:flex;justify-content:center;gap:12px;margin-top:16px}
.pctl .play{width:64px;height:64px;border-radius:50%;font-size:22px}
.list{margin-top:12px}
.li{display:flex;gap:10px;align-items:flex-start;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.li:hover{background:color-mix(in srgb,var(--terra-soft) 45%,transparent)}
.li.cur{background:var(--terra-soft)}
.li .num{font-size:12px;color:var(--muted);width:26px;flex:none;padding-top:3px;text-align:right}
.li .t{flex:1}
.li .t div:first-child{font-weight:500}
.li .t div+div{font-size:14px;color:var(--muted)}
.hidden-en .li .t div+div{display:none}
/* library */
.lib-item{display:flex;gap:8px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.lib-item .t{flex:1;min-width:0}
.lib-item .t .i{font-weight:500}
.lib-item .t .e{font-size:14px;color:var(--muted)}
.star{background:none;border:0;cursor:pointer;font-size:20px;color:var(--line);padding:4px 6px;line-height:1}
.star.on{color:var(--gold)}
.sechead{font-family:var(--serif);font-size:19px;font-weight:650;margin:22px 0 2px}
.subhead{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 2px;font-weight:600}
/* chat */
.chat{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.msg{max-width:86%;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card)}
.msg.me{align-self:flex-end;background:var(--terra-soft);border-color:transparent}
.msg .it{font-weight:500}
.msg .tr{font-size:14px;color:var(--muted);margin-top:4px}
.msg .fix{font-size:14px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.msg .fix b{color:var(--olive)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--ink);color:var(--bg)}
.note{font-size:14px;color:var(--muted);background:color-mix(in srgb,var(--gold-soft) 60%,transparent);border-radius:10px;padding:10px 12px}
.plan li{margin:6px 0}
details summary{cursor:pointer;font-weight:500}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw}
#toast.show{opacity:1}
.kbd{font-size:12px;color:var(--muted)}
.center{text-align:center}
.done{padding:36px 18px;text-align:center}
.done .big{font-size:44px}
</style>
</head>

<script type="text/plain" id="phrases">
# La mattina (The morning)
## Svegliarsi (Waking up)
Mi sveglio alle sei. | I wake up at six.
Mi sveglio presto. | I wake up early.
Di solito mi alzo verso le sei e mezza. | I usually get up around half six.
Stamattina mi sono svegliato tardi. | This morning I woke up late.
È ora di alzarsi. | It's time to get up.
Che ore sono? | What time is it?
Sono ancora stanco. | I'm still tired.
## Con Silvia
Buongiorno amore! | Good morning, love!
Buongiorno, hai dormito bene? | Good morning, did you sleep well?
Come hai dormito? | How did you sleep?
Ho dormito benissimo. | I slept really well.
Ho dormito male stanotte. | I slept badly last night.
Non ho dormito molto. | I didn't sleep much.
Dai, alziamoci! | Come on, let's get up!
Ancora cinque minuti! | Five more minutes!
## In palestra (At the gym)
Andiamo in palestra stamattina? | Shall we go to the gym this morning?
Vieni in palestra con me? | Are you coming to the gym with me?
Oggi andiamo in palestra insieme. | Today we're going to the gym together.
Sì, andiamo! | Yes, let's go!
Sei pronta? | Are you ready? (to Silvia)
Sono pronto, andiamo. | I'm ready, let's go.
Oggi non ho voglia di andare in palestra. | I don't feel like going to the gym today.
Oggi salto la palestra. | I'm skipping the gym today.
Di solito vado in palestra con Silvia la mattina presto. | I usually go to the gym with Silvia early in the morning.
Cosa facciamo oggi, gambe o braccia? | What are we doing today, legs or arms?
Oggi faccio gambe. | Today I'm doing legs.
Oggi mi alleno con i pesi. | Today I'm training with weights.
Oggi faccio cardio. | Today I'm doing cardio.
Hai la borraccia? | Have you got your water bottle?
Prendi tu le chiavi? | Will you grab the keys?
È stato un buon allenamento. | That was a good workout.
Sono distrutto! | I'm wrecked!
# Bruno
Dopo la palestra porto fuori Bruno. | After the gym I take Bruno out.
Porto a spasso il cane. | I walk the dog.
Vado a fare una passeggiata con Bruno. | I'm going for a walk with Bruno.
Porto Bruno al parco. | I take Bruno to the park.
## A Bruno (To Bruno)
Bruno, vieni qui! | Bruno, come here!
Bruno, andiamo! | Bruno, let's go!
Bravo! Bravo cane! | Good boy! Good dog!
Seduto! | Sit!
Resta! | Stay!
No, Bruno, lascia! | No, Bruno, leave it!
## Con Silvia
Dov'è il guinzaglio? | Where's the lead?
Hai visto il guinzaglio di Bruno? | Have you seen Bruno's lead?
Hai preso i sacchetti? | Did you grab the poo bags?
Bruno ha già mangiato? | Has Bruno eaten already?
Hai dato da mangiare a Bruno? | Did you feed Bruno?
Gli do da mangiare io. | I'll feed him.
Porti fuori tu Bruno o lo porto io? | Are you taking Bruno out or am I?
Lo porto io, tu fai la doccia. | I'll take him, you have a shower.
Bruno ha bisogno di un bagno. | Bruno needs a bath.
Bruno è stanchissimo oggi. | Bruno is exhausted today.
# Colazione e caffè (Breakfast and coffee)
Per colazione mangio sempre l'avena preparata la sera prima. | For breakfast I always have oats prepared the night before.
Di solito faccio colazione con gli overnight oats. | I usually have overnight oats for breakfast.
Preparo l'avena la sera prima. | I prepare the oats the night before.
Faccio il caffè a casa. | I make coffee at home.
Faccio il caffè anche per Silvia. | I make coffee for Silvia too.
## Con Silvia
Amore, vuoi un caffè? | Love, do you want a coffee?
Ti faccio un caffè? | Shall I make you a coffee?
Ti preparo il caffè? | Shall I make your coffee?
Come lo vuoi? | How do you want it?
Con il latte o senza? | With milk or without?
Vuoi lo zucchero? | Do you want sugar?
Sì, grazie, con un po' di latte. | Yes, thanks, with a bit of milk.
No grazie, per ora no. | No thanks, not for now.
Ecco il tuo caffè. | Here's your coffee.
Attenzione, è caldo. | Careful, it's hot.
È buono il caffè? | Is the coffee good?
Il caffè è finito, dobbiamo comprarlo. | We're out of coffee, we need to buy some.
Abbiamo finito il latte. | We've run out of milk.
Hai già fatto colazione? | Have you had breakfast already?
Cosa mangi per colazione? | What are you having for breakfast?
Non ho fame adesso. | I'm not hungry right now.
Ho una fame da lupi! | I'm starving! (literally: I have a wolf's hunger)
# Ufficio o casa (Office or home)
Oggi vado in ufficio. | Today I'm going into the office.
Oggi lavoro da casa. | Today I'm working from home.
Vado in ufficio in scooter. | I go to the office on the scooter.
Prendo lo scooter. | I'm taking the scooter.
Oggi vado in macchina. | Today I'm driving.
C'è traffico stamattina. | There's traffic this morning.
Ci metto venti minuti per arrivare in ufficio. | It takes me twenty minutes to get to the office.
Ho una riunione alle nove. | I have a meeting at nine.
Ho tante riunioni oggi. | I have lots of meetings today.
## Con Silvia
Vai in ufficio oggi? | Are you going into the office today?
Lavori da casa oggi? | Are you working from home today?
A che ora torni stasera? | What time are you back tonight?
Torno verso le sei. | I'll be back around six.
Stasera faccio tardi. | I'll be late tonight.
Ho una chiamata, puoi fare silenzio un attimo? | I have a call, can you be quiet for a moment?
Sono in una call, ti chiamo dopo. | I'm on a call, I'll ring you after.
Buona giornata! | Have a good day!
Anche a te! | You too!
Ci vediamo stasera. | See you tonight.
A dopo! | See you later!
Scrivimi quando arrivi. | Text me when you get there.
Fai attenzione con lo scooter! | Be careful on the scooter!
# Il mio lavoro (My job)
Lavoro nelle vendite. | I work in sales.
Lavoro per HubSpot. | I work for HubSpot.
Sono account executive a HubSpot. | I'm an account executive at HubSpot.
Lavoro in un'azienda di software. | I work at a software company.
HubSpot è una piattaforma per il marketing, le vendite e il servizio clienti. | HubSpot is a platform for marketing, sales and customer service.
Vendo software alle aziende. | I sell software to businesses.
Mi piace il mio lavoro. | I like my job.
È un lavoro impegnativo, ma mi piace. | It's a demanding job, but I like it.
Ho un obiettivo di vendita da raggiungere. | I have a sales target to hit.
Ho chiuso un contratto oggi! | I closed a deal today!
Questo mese è stato difficile. | This month has been tough.
## Con Silvia
Com'è andata la giornata? | How was your day?
Com'è andato il lavoro oggi? | How was work today?
È andata bene, grazie. | It went well, thanks.
Oggi è andata benissimo al lavoro. | Work went really well today.
Oggi è stata una giornata pesante. | Today was a heavy day.
Ho avuto una giornata lunghissima. | I've had a really long day.
Niente di speciale. | Nothing special.
E tu, com'è andata? | And you, how did it go?
# La cena (Dinner)
## Cosa mangiamo? (What are we eating?)
Cosa mangiamo stasera? | What are we eating tonight?
Cosa vuoi per cena? | What do you want for dinner?
Faccio il pollo con le verdure. | I'll make chicken with veggies.
Stasera facciamo il manzo. | Tonight we're having beef.
Che ne dici del salmone? | How about salmon?
Facciamo il pesce al forno? | Shall we do baked fish?
Possiamo fare il pollo alla griglia. | We could do grilled chicken.
Vuoi riso o patate? | Do you want rice or potatoes?
Faccio un'insalata. | I'll make a salad.
Preparo le verdure al forno. | I'll do roast veggies.
## Chi cucina, chi pulisce (Who cooks, who cleans)
Chi cucina stasera? | Who's cooking tonight?
Cucino io stasera. | I'm cooking tonight.
Stasera cucini tu? | Are you cooking tonight?
Tocca a te cucinare. | It's your turn to cook.
Tocca a me. | It's my turn.
Io cucino e tu pulisci. | I cook and you clean.
Facciamo a turno: uno cucina e l'altro pulisce. | We take turns: one cooks and the other cleans.
Ieri ho cucinato io, quindi stasera cucini tu. | I cooked yesterday, so you're cooking tonight.
Mi aiuti a tagliare le verdure? | Can you help me chop the veggies?
Lavo io i piatti. | I'll do the dishes.
Lavi tu i piatti stasera? | Are you doing the dishes tonight?
Metto i piatti nella lavastoviglie. | I'll put the dishes in the dishwasher.
Pulisco la cucina. | I'll clean the kitchen.
## A tavola (At the table)
A che ora mangiamo? | What time are we eating?
La cena è pronta! | Dinner's ready!
È pronto, vieni a mangiare! | It's ready, come and eat!
A tavola! | Dinner's on the table!
Buon appetito! | Enjoy your meal!
Che buono! | So good!
È buonissimo, complimenti! | It's delicious, well done!
Manca un po' di sale. | It needs a bit of salt.
È un po' salato. | It's a bit salty.
Ne vuoi ancora? | Do you want more?
Sono pieno. | I'm full.
Grazie per la cena, amore. | Thanks for dinner, love.
## Al ristorante (At a restaurant)
Un tavolo per due, per favore. | A table for two, please.
Avete un tavolo per stasera? | Do you have a table for tonight?
Possiamo vedere il menù? | Can we see the menu?
Cosa ci consiglia? | What do you recommend?
Per me il salmone, per favore. | The salmon for me, please.
Prendo il pollo. | I'll have the chicken.
Un bicchiere di vino rosso, per favore. | A glass of red wine, please.
Il conto, per favore. | The bill, please.
# In cucina (In the kitchen)
## Dov'è...? (Where is...?)
Dov'è il sale? | Where's the salt?
Dove sono i bicchieri? | Where are the glasses?
Dove hai messo il coltello? | Where did you put the knife?
Dove teniamo l'olio d'oliva? | Where do we keep the olive oil?
È nel frigo. | It's in the fridge.
È nel congelatore. | It's in the freezer.
È nel cassetto. | It's in the drawer.
È nell'armadietto in alto. | It's in the top cupboard.
È sul piano di lavoro. | It's on the bench.
È sul tavolo. | It's on the table.
È nella lavastoviglie. | It's in the dishwasher.
È accanto ai fornelli. | It's next to the stove.

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);

const sleep = ms => new Promise(r => setTimeout(r, ms));

function hash(s){ let h = 5381; for (const ch of s) h = ((h << 5) + h + ch.codePointAt(0)) | 0; return "p" + (h >>> 0).toString(36); }

/* ---------- phrase data ---------- */
const BASE = [];

  let sec = null, sub = "";

    const line = raw.trim(); if (!line) continue;
    if (line.startsWith("## ")){ sub = line.slice(3).trim(); continue; }
    if (line.startsWith("# ")){ sec = line.slice(2).trim(); sub = ""; SECTIONS.push(sec); continue; }
    const bar = line.indexOf("|");
    const it = (bar < 0 ? line : line.slice(0, bar)).trim();
    const en = bar < 0 ? "" : line.slice(bar + 1).trim();
    BASE.push({ id: hash(it), it, en, sec, sub });
  }
})();
const CUSTOM_SEC = "Le mie frasi (My phrases)";

/* ---------- state ---------- */
const DEFAULT_SETTINGS = {
  newPerDay: 15, newFrom: "all", dir: "en-it", autoplay: true, rate: 0.95,
  engine: "browser", voiceName: "", model: "claude-sonnet-5-5",
  lSet: "all", lRepeats: 3, lEcho: 1, lShow: "both", lShuffle: false, lLoop: true,
  sSet: "learning", sHide: false, guided: true, lessonNew: 12
};
let S = { v: 1, ts: 0, cards: {}, stars: {}, custom: [], topics: [], explain: {}, settings: { ...DEFAULT_SETTINGS }, days: {}, newLog: {}, speak: {} };

function topicPhrases(){ const out = []; for (const t of (S.topics || [])) for (const p of (t.phrases || [])) out.push({ ...p, sec: t.name, sub: p.sub || "", topic: t.id }); return out; }
function allPhrases(){ return BASE.concat(topicPhrases(), (S.custom || []).map(c => ({ ...c, sec: CUSTOM_SEC, sub: "" }))); }
function uniquePhrases(){ const seen = new Set(), out = []; for (const p of allPhrases()){ if (!seen.has(p.id)){ seen.add(p.id); out.push(p); } } return out; }
function sectionsAll(){ const t = (S.topics || []).map(x => x.name); return SECTIONS.concat(t, (S.custom && S.custom.length) ? [CUSTOM_SEC] : []); }
function byId(id){ return allPhrases().find(p => p.id === id); }

/* ---------- persistence ---------- */
let saveTimer = null;
function setSync(m){ const el = $("#sync"); if (el) el.textContent = m === "err" ? "⚠︎ Not saved" : "Saved on this phone"; }
function loadLocal(){ try { const j = localStorage.getItem("frasi-state-v1"); if (j) return JSON.parse(j); } catch(e){} return null; }
function applyState(o){ if (!o || typeof o !== "object") return;
  S = { ...S, ...o, settings: { ...DEFAULT_SETTINGS, ...(o.settings || {}) } };
  for (const k of ["cards","stars","days","newLog","speak","explain"]) if (!S[k] || typeof S[k] !== "object") S[k] = {};
  if (!Array.isArray(S.custom)) S.custom = [];
  if (!Array.isArray(S.topics)) S.topics = [];
}
function save(){
  S.ts = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem("frasi-state-v1", JSON.stringify(S)); setSync("ok"); } catch(e){ setSync("err"); toast("Couldn't save. Storage may be full."); } }, 300);
}
window.addEventListener("pagehide", () => { try { localStorage.setItem("frasi-state-v1", JSON.stringify(S)); } catch(e){} });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") try { localStorage.setItem("frasi-state-v1", JSON.stringify(S)); } catch(e){} });
function getKey(){ try { return localStorage.getItem("frasi-api-key") || ""; } catch(e){ return ""; } }

function hasKey(){ return !!getKey(); }

/* ---------- speech out ---------- */
let tts = null, itVoice = null, speaking = false;
let itVoices = [];
function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  itVoices = speechSynthesis.getVoices().filter(v => /^it/i.test(v.lang));
  const want = S.settings && S.settings.voiceName;
  itVoice = (want && itVoices.find(v => v.name === want)) || itVoices.find(v => /enhanced|premium|migliorat/i.test(v.name)) || itVoices.find(v => /Alice|Federica|Paola|Emma|Google italiano/i.test(v.name)) || itVoices[0] || null;
}
if ("speechSynthesis" in window){ pickVoice(); try { speechSynthesis.addEventListener("voiceschanged", () => { const had = itVoices.length; pickVoice(); if (!had && itVoices.length && view === "oggi") render(); }); } catch(e){} }
function engine(){
  const e = S.settings.engine, hasB = "speechSynthesis" in window;
  if (e === "claude") return tts ? "claude" : (hasB ? "browser" : null);
  if (e === "browser") return hasB ? "browser" : (tts ? "claude" : null);
  if (hasB && itVoice) return "browser";
  return tts ? "claude" : (hasB ? "browser" : null);
}
function browserSpeak(text, rate){
  return new Promise((res, rej) => {
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "it-IT"; if (itVoice) u.voice = itVoice; u.rate = rate;

    } catch(e){ rej({ code: "error" }); }
  });
}
async function speak(text, rate){
  rate = rate || S.settings.rate;
  const e = engine();
  speaking = true;
  try {
    if (e === "claude"){
      try { await tts.speak(text, { language: "it", rate: Math.min(1.5, Math.max(0.7, rate)), voice: S.settings.voice }); }
      catch(err){
        if (err && (err.code === "viewer_stopped" || err.code === "busy")) throw err;
        if ("speechSynthesis" in window) await browserSpeak(text, rate); else throw err;

  } finally { speaking = false; }
}
function stopSpeech(){ try { tts && tts.stop(); } catch(e){} try { "speechSynthesis" in window && speechSynthesis.cancel(); } catch(e){} }
function say(text, rate){ stopListen(); speak(text, rate).catch(e => { if (e && e.code === "no_voice") toast("No Italian voice available on this device"); }); }

/* ---------- dictation (speech in) ---------- */
let dict = null, dictState = "idle", dictH = null, dictDenied = false;
function wireDictation(d){
  dict = d;
  d.onPartial(({ text }) => dictH && dictH.partial && dictH.partial(text));
  d.onFinal(({ text }) => dictH && dictH.final && dictH.final(text));

function makeRecognizer(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition; if (!SR) return null;
  let rec = null; const h = {};

    onPartial(fn){ h.p = fn; }, onFinal(fn){ h.f = fn; }, onState(fn){ h.s = fn; },
    start(){
      return new Promise((res, rej) => {
        try {
          rec = new SR(); rec.lang = "it-IT"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
          let ended = false;

  if (dictState === "listening"){ dict.stop().catch(() => {}); return; }

}

/* ---------- answer checking ---------- */
function normWord(w){ return w.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, ""); }
function lev(a, b){ if (a === b) return 0; const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++){ const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1)); prev = cur; }
  return prev[n]; }
function wordEq(a, b){ if (a === b) return true; const L = Math.max(a.length, b.length); return L >= 4 && lev(a, b) <= (L >= 8 ? 2 : 1); }
function compare(target, attempt){
  const disp = target.split(/\s+/).filter(Boolean);
  const T = disp.map(normWord), A = attempt.split(/\s+/).map(normWord).filter(Boolean);
  const keep = T.map(w => w.length > 0);
  const m = T.length, n = A.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = m - 1; i >= 0; i--) for (let j = n - 1; j >= 0; j--)
    dp[i][j] = (T[i] && wordEq(T[i], A[j])) ? dp[i+1][j+1] + 1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const ok = new Array(m).fill(false); let i = 0, j = 0;
  while (i < m && j < n){ if (T[i] && wordEq(T[i], A[j])){ ok[i] = true; i++; j++; } else if (dp[i+1][j] >= dp[i][j+1]) i++; else j++; }
  const total = keep.filter(Boolean).length || 1;
  const hit = ok.filter(Boolean).length;
  const html = disp.map((w, k) => keep[k] ? `<span class="w ${ok[k] ? "ok" : "miss"}">${esc(w)}</span>` : esc(w)).join(" ");
  return { score: hit / total, html };
}
function verdict(s){ return s >= 0.95 ? "Perfetto! 🎉" : s >= 0.75 ? "Quasi! Very close" : s >= 0.4 ? "Not bad, keep going" : "Riprova, listen again"; }

/* ---------- spaced repetition ---------- */
function schedule(c, r, now = Date.now()){
  c = c ? { ...c } : { s: "new", st: 0, ivl: 0, ease: 2.5, reps: 0, lap: 0, due: now };
  if (c.s === "new"){ c.s = "learn"; c.st = 0; c.intro = today(); }
  if (c.s === "learn" || c.s === "relearn"){
    const relearn = c.s === "relearn", steps = relearn ? [10] : [1, 10];
    if (r === 1){ c.st = 0; c.due = now + steps[0] * MIN; }
    else if (r === 2){ c.due = now + (c.st === 0 && steps.length > 1 ? 6 : steps[c.st] * 1.5) * MIN; }

      if (c.st >= steps.length){ c.s = "review"; c.ivl = relearn ? Math.max(1, c.ivl) : 1; c.due = now + c.ivl * DAY; }
      else c.due = now + steps[c.st] * MIN;
    } else { c.s = "review"; c.ivl = relearn ? Math.max(2, c.ivl + 1) : 4; c.due = now + c.ivl * DAY; }
  } else {
    if (r === 1){ c.lap++; c.ease = Math.max(1.3, c.ease - 0.2); c.ivl = Math.max(1, Math.round(c.ivl * 0.3)); c.s = "relearn"; c.st = 0; c.due = now + 10 * MIN; }
    else {
      let iv;
      if (r === 2){ iv = c.ivl * 1.2; c.ease = Math.max(1.3, c.ease - 0.15); }
      else if (r === 3){ iv = c.ivl * c.ease; }
      else { iv = c.ivl * c.ease * 1.3; c.ease = Math.min(3.2, c.ease + 0.15); }
      iv = Math.max(c.ivl + 1, Math.round(iv * (0.95 + Math.random() * 0.1)));
      c.ivl = Math.min(iv, 365); c.due = now + c.ivl * DAY;
    }
  }
  c.reps++; c.last = now;
  return c;
}
function fmtIvl(ms){
  if (ms < 60 * MIN) return Math.max(1, Math.round(ms / MIN)) + " min";
  if (ms < DAY) return Math.round(ms / (60 * MIN)) + " h";
  const d = Math.round(ms / DAY);
  if (d < 31) return d + (d === 1 ? " day" : " days");
  const mo = Math.round(d / 30); return mo + (mo === 1 ? " month" : " months");
}
function status(id){
  const c = S.cards[id];
  if (!c) return { k: "new", label: "New" };
  if (c.s !== "review") return { k: "learn", label: "Learning" };
  if (c.ivl >= 21) return { k: "known", label: "Mastered" };
  return { k: "known", label: c.ivl + "d" };
}
function queue(){
  const eod = endOfToday(), learn = [], rev = [], fresh = [];
  for (const p of uniquePhrases()){
    const c = S.cards[p.id];
    if (!c){ fresh.push(p); continue; }
    if (c.s === "review"){ if (c.due <= eod) rev.push(p); }
    else learn.push(p);
  }
  const newLeft = S.settings.guided ? 0 : Math.max(0, S.settings.newPerDay - (S.newLog[today()] || 0));
  const nf = S.settings.newFrom;
  const freshF = nf === "all" ? fresh : fresh.filter(p => p.sec === nf);
  rev.sort((a, b) => S.cards[a.id].due - S.cards[b.id].due);
  learn.sort((a, b) => S.cards[a.id].due - S.cards[b.id].due);
  return { learn, rev, fresh: freshF.slice(0, newLeft), newLeft, freshTotal: freshF.length, allFresh: fresh.length };
}
let lastShown = null;
function pickNext(){
  const q = queue(), now = Date.now();
  const dueLearn = q.learn.filter(p => S.cards[p.id].due <= now);
  const cands = dueLearn.concat(q.rev, q.fresh);
  if (cands.length) return cands.find(p => p.id !== lastShown) || cands[0];
  if (q.learn.length) return { wait: S.cards[q.learn[0].id].due, ahead: q.learn[0] };
  return null;
}
function streak(){
  let n = 0; const d = new Date();
  if (!S.days[today(d)]) d.setDate(d.getDate() - 1);
  while (S.days[today(d)]){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

function setOptions(sel){

}
function setPhrases(key){
  const all = allPhrases();
  const u = uniquePhrases();
  switch (key){
    case "all": return all;
    case "learning": return u.filter(p => { const c = S.cards[p.id]; return c && (c.s !== "review" || c.ivl < 7); });
    case "today": return u.filter(p => { const c = S.cards[p.id]; return c && c.intro === today(); });
    case "hard": return u.filter(p => { const c = S.cards[p.id]; return c && (c.lap > 0 || c.ease < 2.3); });
    case "starred": return u.filter(p => S.stars[p.id]);
    default: return all.filter(p => p.sec === key);
  }
}

const L = { list: [], i: 0, rep: 0, playing: false, token: 0, key: "" };
function listenList(){
  const s = S.settings, key = s.lSet + "|" + s.lShuffle + "|" + allPhrases().length;
  if (key !== L.key){ let ps = setPhrases(s.lSet); if (s.lShuffle) ps = shuffle(ps); L.list = ps; L.key = key; L.i = Math.min(L.i, Math.max(0, ps.length - 1)); L.rep = 0; }
  return L.list;
}
function stopListen(){ if (L.playing){ L.playing = false; L.token++; stopSpeech(); updatePlayer(); } }
async function playLoop(){
  const tok = ++L.token; L.playing = true;
  while (L.playing && tok === L.token){
    const p = L.list[L.i]; if (!p){ L.playing = false; break; }
    updatePlayer();
    const t0 = performance.now();
    try { await speak(p.it); }
    catch(e){ if (tok !== L.token) return; if (e && e.code === "no_voice"){ toast("No Italian voice available on this device"); L.playing = false; break; } }
    if (tok !== L.token) return;
    const dur = Math.max(600, performance.now() - t0);
    await sleep(S.settings.lEcho * dur + 450);
    if (tok !== L.token) return;
    L.rep++;
    const reps = S.settings.lRepeats;
    if (reps !== 0 && L.rep >= reps){
      L.rep = 0; L.i++;
      if (L.i >= L.list.length){
        if (S.settings.lLoop){ L.i = 0; if (S.settings.lShuffle) L.list = shuffle(L.list); }
        else { L.i = 0; L.playing = false; break; }
      }
    }
  }
  updatePlayer();
}
function jump(i){ if (!L.list.length) return; L.i = (i + L.list.length) % L.list.length; L.rep = 0; if (L.playing){ L.token++; stopSpeech(); playLoop(); } else updatePlayer(); }

}

async function ai(prompt, maxTokens){
  const key = getKey(); if (!key) throw { code: "no_key" };

  try {
    r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: S.settings.model || "claude-sonnet-5-5", max_tokens: maxTokens || 1200, messages: [{ role: "user", content: prompt }] })
    });
  } catch(e){ throw { code: "network", message: "No internet connection" }; }
  if (!r.ok){
    let msg = ""; try { msg = (await r.json()).error.message; } catch(e){}
    throw { code: r.status === 401 ? "bad_key" : r.status === 429 ? "rate_limited" : r.status === 400 && /credit/i.test(msg) ? "credit" : "http", message: msg };
  }
  const j = await r.json();
  return { text: (j.content || []).filter(b => b.type === "text").map(b => b.text).join("") };
}

  const c = e && e.code;

    : c === "rate_limited" ? "Too many requests. Wait a moment and try again."
    : c === "credit" ? "Your Anthropic account needs credit (console.anthropic.com → Billing)."
    : c === "network" ? "No internet connection"

}

let G = { topic: "", n: 20, busy: false, result: null, keep: {}, addTo: "" };
const IDEAS = ["Food and cooking chat", "Ordering at a restaurant in Sicily", "Shopping at the market", "Talking about the weather", "Making plans with friends", "At the doctor's or pharmacy", "Travel: trains, hotels, directions", "Talking about family", "Phone calls and messages", "Compliments and feelings"];
function genPrompt(){
  const existing = allPhrases().map(p => p.it);
  const target = G.addTo ? (S.topics.find(t => t.id === G.addTo) || {}).name : "";
  return `Create ${G.n} useful, natural everyday Italian phrases for a beginner (A1 to A2) on this topic: "${G.topic || target}".
${ABOUT}
Guidelines:
- Things he would genuinely say or hear in real life with Silvia, her family, or Italians. Mostly short (3 to 10 words), high frequency, present tense mostly.
- Mix questions and answers, and include a few useful variations of the same idea.
- Group them into 2 to 5 small subgroups in a sensible order.
- Natural English translations (UK English), with a short note in brackets only where it really helps, e.g. (to Silvia) or (formal).
- Do NOT repeat any of these phrases he already has: ${JSON.stringify(existing.slice(-400))}
Return JSON only, no other text:
{"title":"Italian title (English title)","groups":[{"name":"Italian name (English name)","phrases":[{"it":"...","en":"..."}]}]}`;
}
async function generate(){
  if (!hasKey()){ toast(aiError({ code: "no_key" })); return; }
  if (!G.topic.trim() && !G.addTo){ toast("Type a topic first"); return; }
  G.busy = true; G.result = null; render();
  try {
    const r = await ai(genPrompt(), 4000);
    const j = parseJSON(r.text);
    if (!j || !Array.isArray(j.groups)) throw { code: "parse", message: "Unexpected answer, try again" };
    const have = new Set(allPhrases().map(p => p.id));
    j.groups.forEach(g => { g.phrases = (g.phrases || []).filter(x => x && x.it).map(x => ({ id: hash(String(x.it).trim()), it: String(x.it).trim(), en: String(x.en || "").trim() })).filter(x => !have.has(x.id)); });
    j.groups = j.groups.filter(g => g.phrases.length);
    G.result = j; G.keep = {};
    j.groups.forEach(g => g.phrases.forEach(x => G.keep[x.id] = true));
  } catch(e){ toast(e && e.code === "parse" ? e.message : aiError(e)); }
  G.busy = false; render();
}
function saveGenerated(){
  const j = G.result; if (!j) return;
  const items = []; j.groups.forEach(g => g.phrases.forEach(x => { if (G.keep[x.id]) items.push({ ...x, sub: String(g.name || "") }); }));
  if (!items.length){ toast("Tick at least one phrase"); return; }
  let t = G.addTo && S.topics.find(x => x.id === G.addTo);
  if (!t){ t = { id: "t" + Date.now().toString(36), name: String(j.title || G.topic).trim() || "Nuovo argomento", created: today(), phrases: [] }; S.topics.push(t); }
  const have = new Set(allPhrases().map(p => p.id));
  for (const it of items) if (!have.has(it.id)){ t.phrases.push(it); have.add(it.id); }
  save();
  toast(items.length + " phrases added to “" + t.name + "”");
  G = { topic: "", n: G.n, busy: false, result: null, keep: {}, addTo: "" };
  render();
}

/* ---------- GUIDED COURSE ---------- */
const UNIT_ORDER = ["Chiacchiere (Small talk)","Come stai? (How are you?)","Colazione e caffè (Breakfast and coffee)","La cena (Dinner)","La mattina (The morning)","Ufficio o casa (Office or home)","La sera (The evening)","In cucina (In the kitchen)","Bruno","Il weekend (The weekend)","Il mio lavoro (My job)","Con i genitori di Silvia (With Silvia's parents)"];
function courseState(){
  if (!S.course || typeof S.course !== "object") S.course = {};
  const c = S.course;
  if (!c.day) c.day = 1;
  if (!c.checked || typeof c.checked !== "object") c.checked = {};
  if (!Array.isArray(c.history)) c.history = [];
  if (c.session === undefined) c.session = null;
  return c;
}
function units(){ const order = UNIT_ORDER.filter(u => SECTIONS.includes(u)); for (const s of sectionsAll()) if (!order.includes(s)) order.push(s); return order; }
function unitPhrases(u){ const seen = new Set(); return allPhrases().filter(p => p.sec === u && !seen.has(p.id) && seen.add(p.id)); }
function currentUnit(){
  const c = courseState();
  for (const u of units()){
    const ps = unitPhrases(u); if (!ps.length) continue;
    if (ps.some(p => !S.cards[p.id])) return { u, mode: "new", ps };
    if (!c.checked[u]) return { u, mode: "check", ps };
  }
  return null;
}
function unitStatus(u){
  const c = courseState(), ps = unitPhrases(u);
  const intro = ps.filter(p => S.cards[p.id]).length;
  const learned = ps.filter(p => S.cards[p.id] && S.cards[p.id].s === "review").length;
  return { total: ps.length, intro, learned, done: !!c.checked[u] };
}
function roleFor(u){
  if (/genitori/i.test(u)) return "Silvia's mum (her dad sometimes chips in). They are on a video call from Italy and speak to Conor with tu";
  if (/Chiacchiere/i.test(u)) return "Luca, a friendly Italian guy Conor has just met";
  return "Silvia, Conor's Italian wife";
}
function dueIds(exclude){
  const eod = endOfToday(), ex = new Set(exclude || []);
  return uniquePhrases().filter(p => { const k = S.cards[p.id]; return k && k.due <= eod && !ex.has(p.id); })
    .sort((a, b) => S.cards[a.id].due - S.cards[b.id].due).slice(0, 60).map(p => p.id);
}
function pick(ids, n){ return shuffle(ids).slice(0, n); }
function buildSession(kind){
  const c = courseState(), cu = currentUnit();
  let steps = [], newIds = [], unit = cu ? cu.u : null, mode = cu ? cu.mode : "free";
  if (kind === "mini"){
    steps = [{ k: "review", ids: dueIds() }];
  } else if (!cu){
    const all = uniquePhrases().filter(p => S.cards[p.id]).map(p => p.id);
    steps = [{ k: "review", ids: dueIds() }, { k: "quiz", ids: pick(all, 25) }, { k: "listen", ids: pick(all, 15) }, { k: "speak", ids: pick(all, 15), need: 6 }, { k: "mission", ids: pick(all, 3) }];
  } else if (cu.mode === "new"){
    const fresh = cu.ps.filter(p => !S.cards[p.id]);
    const N = S.settings.lessonNew || 12;
    newIds = (fresh.length <= N + 3 ? fresh : fresh.slice(0, N)).map(p => p.id);
    const recent = cu.ps.filter(p => S.cards[p.id]).slice(-8).map(p => p.id);
    steps = [
      { k: "review", ids: dueIds(newIds) },
      { k: "learn", ids: newIds },
      { k: "drill", ids: newIds },
      { k: "listen", ids: newIds.concat(recent) },
      { k: "reverse", ids: newIds },
      { k: "speak", ids: newIds, need: 4 },
      { k: "mission", ids: pick(newIds, 3) }
    ];
  } else {
    const ids = cu.ps.map(p => p.id);
    steps = [
      { k: "review", ids: dueIds(ids) },
      { k: "quiz", ids: shuffle(ids) },
      { k: "listen", ids, reps: 1 },
      { k: "speak", ids: pick(ids, 15), need: 6 },
      { k: "mission", ids: pick(ids, 3) }
    ];
  }
  steps = steps.filter(s => s.ids.length || s.k === "speak");
  steps.forEach(s => { s.q = s.ids.slice(); });
  return { date: today(), kind, day: c.day, unit, mode, steps, i: 0, started: Date.now(), newIds };
}
const STEP_NAMES = { review: "Warm-up review", learn: "Learn today's phrases", drill: "Practise them", listen: "Listen & repeat", reverse: "Understand them", quiz: "Unit test", speak: "Speak", mission: "Today's mission" };
const STEP_HELP = {
  review: "Phrases due today. See the English, say the Italian out loud, then rate yourself.",
  learn: "Meet today's new phrases. Listen, then say each one out loud 3 times.",
  drill: "Now recall them. Phrases you miss come back until you get them.",
  listen: "Keep the screen on. Repeat each phrase out loud in the pause.",
  reverse: "See the Italian. Say what it means in English.",
  quiz: "Every phrase in this section, mixed up. Anything you miss goes back into your reviews.",
  speak: "Use the phrases in a real conversation.",
  mission: "Take them off the screen and into real life."
};
function estMins(st){ const n = st.ids.length; return Math.max(1, Math.round({ review: n * 0.2, learn: n * 0.6, drill: n * 0.5, listen: n * (st.reps === 1 ? 0.2 : 0.35), reverse: n * 0.2, quiz: n * 0.15, speak: 6, mission: 1 }[st.k] || 1)); }
function sessionMins(ss){ return ss.steps.reduce((a, s) => a + estMins(s), 0); }
function startLesson(kind){
  const c = courseState();
  if (kind === "full" && c.lastDone === today()){ toast("Today's lesson is done. The next one unlocks tomorrow."); return; }
  if (c.session){
    const ss = c.session;
    if (ss.date !== today()){ ss.date = today(); const st = ss.steps[ss.i]; if (st && st.k === "review"){ st.ids = dueIds(ss.newIds); st.q = st.ids.slice(); } }
  } else {
    c.session = buildSession(kind);
  }
  c.justDone = null;
  save(); go("lezione");
}
function stepDone(){
  const ss = courseState().session; if (!ss) return;
  stopLs();
  toast("✓ " + STEP_NAMES[ss.steps[ss.i].k]);
  ss.i++; save(); render(); window.scrollTo(0, 0);
}
function finishLesson(){
  const c = courseState(), ss = c.session; if (!ss) return;
  stopLs();
  const mins = Math.max(1, Math.round((Date.now() - ss.started) / 60000));
  if (ss.kind === "mini") c.lastMini = today();
  else { c.lastDone = today(); if (ss.mode === "check" && ss.unit) c.checked[ss.unit] = true; c.day++; }
  c.history.push({ date: today(), day: ss.day, unit: ss.unit, mode: ss.kind === "mini" ? "mini" : ss.mode, mins });
  if (c.history.length > 300) c.history = c.history.slice(-300);
  S.days[today()] = (S.days[today()] || 0) + 1;
  c.justDone = { kind: ss.kind, mins, day: ss.day, unit: ss.unit, mode: ss.mode };
  c.session = null; C.inLesson = false; C.lessonKey = null;
  save(); go("oggi");
}
/* lesson listen player */
const LS = { token: 0, playing: false };
function stopLs(){ if (LS.playing){ LS.playing = false; LS.token++; stopSpeech(); } }
function updateLs(st){
  const el = $("#lsIt"); if (!el) return;
  const p = byId(st.ids[Math.min(st.pos || 0, st.ids.length - 1)]);
  el.textContent = p ? p.it : ""; $("#lsEn").textContent = p ? p.en : "";
  $("#lsMeta").textContent = `Phrase ${Math.min((st.pos || 0) + 1, st.ids.length)} of ${st.ids.length}`;
  $("#lsBar").style.width = Math.round(100 * (st.pos || 0) / st.ids.length) + "%";
  const b = $("#lsPlayBtn"); if (b) b.textContent = LS.playing ? "⏸ Pause" : ((st.pos || 0) ? "▶ Continue" : "▶ Start");
}
async function lsPlay(st){
  stopListen();
  const tok = ++LS.token; LS.playing = true; updateLs(st);
  while (LS.playing && tok === LS.token){
    const p = byId(st.ids[st.pos || 0]);
    if (p){
      updateLs(st);
      const t0 = performance.now();
      try { await speak(p.it); } catch(e){ if (tok !== LS.token) return; if (e && e.code === "no_voice"){ toast("No Italian voice available on this device"); LS.playing = false; break; } }
      if (tok !== LS.token) return;
      await sleep(Math.max(600, performance.now() - t0) + 450);
      if (tok !== LS.token) return;
      st.rep = (st.rep || 0) + 1;
    } else st.rep = st.reps || 2;
    if (st.rep >= (st.reps || 2)){ st.rep = 0; st.pos = (st.pos || 0) + 1; save();
      if (st.pos >= st.ids.length){ LS.playing = false; st.finished = true; save(); render(); return; } }
  }
  updateLs(st);
}
/* lesson view */
let lsTimer = null;
function renderLesson(v){
  const c = courseState(), ss = c.session;
  if (!ss){ v.innerHTML = ""; go("oggi"); return; }
  const st = ss.steps[ss.i];
  if (!st){ finishLesson(); return; }
  const title = ss.kind === "mini" ? "Busy-day review" : ss.mode === "check" ? `Day ${ss.day} · Unit test` : ss.mode === "free" ? `Day ${ss.day} · Mixed practice` : `Day ${ss.day}`;
  v.innerHTML = `
  <div class="row" style="margin-top:16px"><b>${esc(title)}</b>${ss.unit ? `<span class="small muted">${esc(ss.unit)}</span>` : ""}<span class="spacer"></span><span class="small muted" id="lTimer"></span></div>
  <div class="row" style="gap:4px;margin:10px 0 4px">${ss.steps.map((s, i) => `<div style="flex:1;height:6px;border-radius:99px;background:${i < ss.i ? "var(--olive)" : i === ss.i ? "var(--terra)" : "var(--line)"}"></div>`).join("")}</div>
  <h2 style="margin-top:14px">${ss.i + 1}. ${STEP_NAMES[st.k]}</h2>
  <p class="sub">${STEP_HELP[st.k]} <span class="muted">(about ${estMins(st)} min)</span></p>
  <div id="lsBody"></div>
  <p class="center small" style="margin-top:22px"><a href="#oggi" class="muted">Save and leave. You can pick up where you left off.</a></p>`;
  clearInterval(lsTimer);
  const tick = () => { const el = $("#lTimer"); if (!el){ clearInterval(lsTimer); return; } const s = Math.floor((Date.now() - ss.started) / 1000); el.textContent = "⏱ " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
  tick(); lsTimer = setInterval(tick, 1000);
  const body = $("#lsBody");
  if (st.k === "review") lsCard(body, st, "en-it", "srs");
  else if (st.k === "drill") lsCard(body, st, "en-it", "srs");
  else if (st.k === "reverse") lsCard(body, st, "it-en", "got");
  else if (st.k === "quiz") lsCard(body, st, "mixed", "got");
  else if (st.k === "learn") lsLearn(body, st);
  else if (st.k === "listen") lsListen(body, st);
  else if (st.k === "speak") lsSpeak(body, st, ss);
  else if (st.k === "mission") lsMission(body, st, ss);
}
function lsCard(body, st, dirMode, rateMode){
  if (!st.q.length){ stepDone(); return; }
  const id = st.q[0], p = byId(id);
  if (!p){ st.q.shift(); save(); render(); return; }
  if (!st.dirs) st.dirs = {};
  if (dirMode === "mixed" && !st.dirs[id]) st.dirs[id] = Math.random() < 0.5 ? "en-it" : "it-en";
  const dir = dirMode === "mixed" ? st.dirs[id] : dirMode;
  const rev = !!st.rev, c = S.cards[id], now = Date.now();
  const front = dir === "en-it"
    ? `<div class="small muted">How do you say…</div><div class="prompt">${esc(p.en)}</div>`
    : `<div class="small muted">What does this mean?</div><div class="prompt">${esc(p.it)}</div><div class="row" style="margin-top:6px"><button class="btn sm" id="lsPlayQ">🔊 Play</button></div>`;
  const back = dir === "en-it" ? `<div class="answer">${esc(p.it)}</div>` : `<div class="answer">${esc(p.en)}</div>`;
  const buttons = rateMode === "srs"
    ? `<div class="rate">${[["Again",1],["Hard",2],["Good",3],["Easy",4]].map(([l, r]) => `<button class="r${r}" data-r="${r}"><b>${l}</b><span>${fmtIvl(schedule(c, r, now).due - now)}</span></button>`).join("")}</div>`
    : `<div class="row" style="margin-top:16px"><button class="btn big" id="lsMiss" style="flex:1">✗ Missed it</button><button class="btn primary big" id="lsGot" style="flex:1">✓ Got it</button></div>`;
  body.innerHTML = `<div class="small muted center">${st.q.length} to go</div>
  <div class="card" style="margin-top:8px">${front}
  ${rev ? `<hr style="border:0;border-top:1px solid var(--line);margin:16px 0">${back}
     <div class="row" style="margin-top:8px"><button class="btn sm" id="lsPlayA">🔊 Play</button><button class="btn sm" id="lsSlow">🐢 Slow</button><span class="spacer"></span>${hasKey() ? `<button class="btn sm" id="explBtn">💡 Explain</button>` : ""}</div>
     ${S.explain[id] ? `<div class="explain">${esc(S.explain[id])}</div>` : ""}${buttons}`
  : `<p class="small muted" style="margin:14px 0 10px">${dir === "en-it" ? "Say the Italian out loud first." : "Say the English meaning out loud first."}</p><button class="btn primary big" id="lsReveal" style="width:100%">Show answer</button>`}</div>`;
  if ($("#lsPlayQ")) $("#lsPlayQ").onclick = () => say(p.it);
  if (!rev){ $("#lsReveal").onclick = () => { st.rev = true; save(); render(); if (dir === "en-it" || S.settings.autoplay) say(p.it); }; return; }
  $("#lsPlayA").onclick = () => say(p.it); $("#lsSlow").onclick = () => say(p.it, 0.75);
  if ($("#explBtn")) $("#explBtn").onclick = () => explain(p, () => { if (view === "lezione") render(); });
  const next = () => { st.rev = false; save(); stopSpeech(); if (st.q.length) render(); else stepDone(); };
  if (rateMode === "srs"){
    $$(".rate button", body).forEach(b => b.onclick = () => {
      const r = +b.dataset.r; st.q.shift();
      const was = S.cards[id]; if (!was) S.newLog[today()] = (S.newLog[today()] || 0) + 1;
      S.cards[id] = schedule(was, r); S.days[today()] = (S.days[today()] || 0) + 1;
      if (st.k === "drill"){ if (r <= 2) st.q.push(id); }
      else if (r === 1){ st.again = st.again || {}; if (!st.again[id]){ st.again[id] = 1; st.q.push(id); } }
      next();
    });
  } else {
    $("#lsGot").onclick = () => { st.q.shift(); next(); };
    $("#lsMiss").onclick = () => {
      st.q.shift(); st.q.push(id);
      if (st.k === "quiz"){ st.missed = st.missed || {}; if (!st.missed[id] && S.cards[id] && S.cards[id].s === "review"){ st.missed[id] = 1; S.cards[id] = schedule(S.cards[id], 1); } }
      next();
    };
  }
}
function lsLearn(body, st){
  st.j = st.j || 0;
  if (st.j >= st.ids.length){ stepDone(); return; }
  const p = byId(st.ids[st.j]);
  if (!p){ st.j++; save(); render(); return; }
  st.heard = st.heard || {};
  const canNext = st.heard[p.id] || engine() === null;
  body.innerHTML = `<div class="small muted center">${st.j + 1} of ${st.ids.length}</div>
  <div class="card center" style="margin-top:8px;padding:26px 18px">
    ${p.sub ? `<div class="subhead" style="margin-top:0">${esc(p.sub)}</div>` : ""}
    <div class="answer" style="font-size:30px">${esc(p.it)}</div>
    <div class="en" style="margin-top:6px">${esc(p.en)}</div>
    <div class="row" style="justify-content:center;margin-top:18px"><button class="btn primary" id="lnPlay">🔊 Listen</button><button class="btn" id="lnSlow">🐢 Slow</button>${hasKey() ? `<button class="btn" id="explBtn">💡 Explain</button>` : ""}</div>
    ${S.explain[p.id] ? `<div class="explain" style="text-align:left">${esc(S.explain[p.id])}</div>` : ""}
    <p class="small muted" style="margin:16px 0 0">Now say it out loud 3 times. Copy the rhythm.</p>
  </div>
  <button class="btn primary big" id="lnNext" style="width:100%;margin-top:12px" ${canNext ? "" : "disabled"}>${canNext ? (st.j + 1 < st.ids.length ? "I've said it 3 times · Next →" : "Done · Next step →") : "Listen first"}</button>`;
  const hear = rate => { st.heard[p.id] = 1; save(); say(p.it, rate); const b = $("#lnNext"); if (b && b.disabled){ b.disabled = false; b.textContent = st.j + 1 < st.ids.length ? "I've said it 3 times · Next →" : "Done · Next step →"; } };
  $("#lnPlay").onclick = () => hear(); $("#lnSlow").onclick = () => hear(0.75);
  if ($("#explBtn")) $("#explBtn").onclick = () => explain(p, () => { if (view === "lezione") render(); });
  $("#lnNext").onclick = () => { st.j++; save(); if (st.j >= st.ids.length){ stepDone(); return; } render(); const np = byId(st.ids[st.j]); if (np){ st.heard[np.id] = 1; save(); say(np.it); const b = $("#lnNext"); if (b){ b.disabled = false; b.textContent = st.j + 1 < st.ids.length ? "I've said it 3 times · Next →" : "Done · Next step →"; } } };
  if (st.j === 0 && !st.autoplayed){ st.autoplayed = true; }
}
function lsListen(body, st){
  st.pos = st.pos || 0;
  body.innerHTML = `<div class="card player">
    <div class="it" id="lsIt"></div><div class="en" id="lsEn"></div>
    <div class="bar" style="margin:16px 0 6px"><i id="lsBar" style="width:0"></i></div>
    <div class="meta" id="lsMeta"></div>
    ${st.finished ? `<p class="score" style="margin-top:14px">✓ All done</p>` : `<div class="pctl"><button class="btn primary big" id="lsPlayBtn">▶ Start</button></div>`}
    <p class="small muted" style="margin:14px 0 0">Each phrase plays ${st.reps === 1 ? "once" : "twice"} with a pause for you to repeat it. Keep the screen on.</p>
  </div>
  ${st.finished ? `<button class="btn primary big" id="lsNext" style="width:100%;margin-top:12px">Next step →</button>` : ""}`;
  updateLs(st);
  if (st.finished){ $("#lsIt").textContent = "Bravo! 👏"; $("#lsEn").textContent = ""; $("#lsBar").style.width = "100%"; $("#lsNext").onclick = stepDone; return; }
  $("#lsPlayBtn").onclick = () => { if (LS.playing){ stopLs(); updateLs(st); } else lsPlay(st); };
}
function lsSpeak(body, st, ss){
  const ps = st.ids.map(byId).filter(Boolean);
  if (hasKey()){
    const key = ss.date + "-" + ss.day + "-" + ss.kind;
    let sc = SCENARIOS.find(x => x.k === "lesson"); if (!sc){ sc = { k: "lesson" }; SCENARIOS.push(sc); }
    Object.assign(sc, { t: "💬 " + (ss.unit || "Practice"), role: roleFor(ss.unit || ""), setting: `An everyday conversation about "${ss.unit || "daily life"}". Steer it so Conor naturally gets chances to use these phrases he is learning, without listing them: ${ps.map(p => p.it).join(" / ")}` });
    C.inLesson = true; C.scen = "lesson";
    if (C.lessonKey !== key){ C.lessonKey = key; C.msgs = []; C.draft = ""; setTimeout(aiTurn, 0); }
    const mine = C.msgs.filter(m => m.who === "me").length;
    body.innerHTML = `<div class="note">Reply in Italian at least <b>${st.need}</b> times (${Math.min(mine, st.need)}/${st.need}). Try to use today's phrases. Speak your replies with 🎙️ if it works, or type them.</div>
      <details style="margin-top:10px"><summary class="small">Today's phrases (peek if you're stuck)</summary>${ps.map(p => `<div class="small" style="margin-top:4px">${esc(p.it)} <span class="muted">· ${esc(p.en)}</span></div>`).join("")}</details>
      <div id="lsChat" style="margin-top:6px"></div>
      <button class="btn primary big" id="lsNext" style="width:100%;margin-top:12px" ${mine >= st.need ? "" : "disabled"}>${mine >= st.need ? "Next step →" : `Send ${st.need - mine} more repl${st.need - mine === 1 ? "y" : "ies"}`}</button>`;
    renderChat($("#lsChat"), micAvailable());
    $("#lsNext").onclick = () => { C.inLesson = false; stepDone(); };
    return;
  }
  st.said = st.said || {};
  const all = ps.every(p => st.said[p.id]);
  body.innerHTML = `<div class="note">Say each phrase out loud as if you were saying it to Silvia. Listen first if you need to. (With an API key, this step becomes a real chat with Silvia.)</div>
    <div class="card" style="margin-top:10px;padding:4px 16px">${ps.map(p => `<div class="lib-item"><button class="btn ghost sm" data-say="${p.id}">🔊</button><div class="t"><div class="i">${esc(p.it)}</div><div class="e">${esc(p.en)}</div></div><button class="btn sm ${st.said[p.id] ? "primary" : ""}" data-said="${p.id}">${st.said[p.id] ? "✓ Said" : "Said it"}</button></div>`).join("")}</div>
    <button class="btn primary big" id="lsNext" style="width:100%;margin-top:12px" ${all ? "" : "disabled"}>${all ? "Next step →" : "Say them all first"}</button>`;
  $$("[data-say]", body).forEach(b => b.onclick = () => { const p = byId(b.dataset.say); if (p) say(p.it); });
  $$("[data-said]", body).forEach(b => b.onclick = () => { const id = b.dataset.said; st.said[id] = !st.said[id]; save(); render(); });
  $("#lsNext").onclick = stepDone;
}
function lsMission(body, st, ss){
  const ps = st.ids.map(byId).filter(Boolean);
  body.innerHTML = `<div class="card">
    <p style="margin-top:0">Use these with Silvia today, at breakfast, at dinner or on a walk with Bruno:</p>
    ${ps.map(p => `<div class="lib-item"><button class="btn ghost sm" data-say="${p.id}">🔊</button><div class="t"><div class="i">${esc(p.it)}</div><div class="e">${esc(p.en)}</div></div></div>`).join("")}
    <p class="small muted">Tip: tell her you're practising. She can reply in simple Italian.</p>
  </div>

function courseCard(){
  const c = courseState(), ss = c.session, cu = currentUnit(), us = units();
  const done = c.lastDone === today();
  let main = "";
  if (c.justDone && (done || c.lastMini === today())){
    const j = c.justDone;
    main = `<div class="center" style="padding:6px 0 4px"><div style="font-size:42px">🎉</div>
      <h2 style="margin:4px 0">${j.kind === "mini" ? "Reviews done!" : `Day ${j.day} complete!`}</h2>
      <p class="sub" style="margin:0 0 6px">${j.mins} minutes. ${j.kind === "mini" ? "Your reviews are on track. The full lesson is still waiting when you have time." : `Day ${j.day + 1} unlocks tomorrow.`}</p></div>`;
  } else if (done){
    main = `<div class="center"><div style="font-size:34px">✅</div><h2 style="margin:4px 0">Today's lesson is done</h2><p class="sub" style="margin:0">Day ${c.day} unlocks tomorrow. Practise with Silvia tonight!</p></div>`;
  } else if (ss){
    const st = ss.steps[ss.i];
    main = `<div class="small muted">${ss.kind === "mini" ? "Busy-day review" : `Day ${ss.day}`}${ss.unit ? " · " + esc(ss.unit) : ""}</div>
      <h2 style="margin:4px 0 2px">Pick up where you left off</h2>
      <p class="sub">Step ${ss.i + 1} of ${ss.steps.length}: ${st ? STEP_NAMES[st.k] : ""}</p>
      <button class="btn primary big" id="lessonGo" style="width:100%">▶ Continue lesson</button>`;
  } else {
    const preview = buildSession("full");
    const kindTxt = !cu ? "Course complete: mixed practice of everything" : cu.mode === "check" ? `Unit test: ${esc(cu.u)}` : `${esc(cu.u)} · ${preview.newIds.length} new phrases`;
    const dueN = dueIds().length;
    main = `<div class="small muted">Day ${c.day}${cu ? ` · Unit ${us.indexOf(cu.u) + 1} of ${us.length}` : ""}</div>
      <h2 style="margin:4px 0 2px">Today's lesson</h2>
      <p class="sub">${kindTxt}. About ${sessionMins(preview)} minutes.</p>
      <ol class="small" style="padding-left:20px;margin:0 0 14px;color:var(--muted)">${preview.steps.map(s => `<li>${STEP_NAMES[s.k]}${s.k === "review" ? ` (${s.ids.length})` : ""}</li>`).join("")}</ol>
      <button class="btn primary big" id="lessonGo" style="width:100%">▶ Start today's lesson</button>
      ${dueN ? `<p class="center small" style="margin:10px 0 0"><a href="#oggi" id="miniGo" class="muted">Busy day? Do just the reviews (${dueN}, about ${Math.max(2, Math.round(dueN * 0.25))} min). Your next lesson stays locked until you finish a full one.</a></p>` : ""}`;
  }
  const map = us.map((u, i) => {
    const s = unitStatus(u); if (!s.total) return "";
    const isCur = cu && cu.u === u;
    const icon = s.done ? "✅" : isCur ? "▶️" : s.intro ? "◐" : "🔒";
    return `<div class="secrow"><div><div>${icon} ${esc(u)}</div><div class="bar"><i style="width:${Math.round(100 * s.learned / s.total)}%"></i></div></div><div class="small muted" style="text-align:right">${s.learned}/${s.total}</div></div>`;
  }).join("");
  return { main, map };
}
function wireCourseCard(v){
  if ($("#lessonGo", v)) $("#lessonGo", v).onclick = () => startLesson(courseState().session ? courseState().session.kind : "full");
  if ($("#miniGo", v)) $("#miniGo", v).onclick = e => { e.preventDefault(); startLesson("mini"); };
}
